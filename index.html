<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarchi Madaan | Interaction Designer</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=4" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&display=swap"
    rel="stylesheet">
  <!-- Carlito: open look-alike of Calibri, used for the live type specimens on the Pawly page -->
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Alte Haas Grotesk', 'Arial', 'sans-serif'],
            sans: ['Josefin Sans', 'sans-serif'],
          },
          colors: {
            'paper': '#FFFDF5',
            'paper-dark': '#0A0A0A',
            'ink': '#1A1A1A',
            'cobalt': '#2A52BE', // Brighter cobalt
            'fun-pink': '#FF00CC',
            'fun-lime': '#CCFF00',
          },
          boxShadow: {
            'hard': '4px 4px 0px 0px currentColor',
            'hard-lg': '8px 8px 0px 0px currentColor',
            'hard-sm': '2px 2px 0px 0px currentColor',
          },
          animation: {
            'spin-slow': 'spin 12s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'marquee': 'marquee 25s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-100%)' },
            }
          }
        },
      },
    }
  </script>
  <style>
    @font-face {
      font-family: 'Alte Haas Grotesk';
      src: url('/fonts/AlteHaasGroteskRegular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Alte Haas Grotesk';
      src: url('/fonts/AlteHaasGroteskBold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* Clean Brutalist Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      background: transparent;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border-left: 1px solid currentColor;
    }

    ::-webkit-scrollbar-thumb {
      background: currentColor;
    }

    ::-webkit-scrollbar-thumb:hover {
      opacity: 0.8;
    }

    body {
      cursor: default;
      font-family: 'Josefin Sans', sans-serif; /* body text everywhere; the display font is set per element */
      font-weight: 375;
    }
    .font-display { font-weight: 400; } /* display text keeps the weight it always had (headings would otherwise inherit the body's weight) */

    /* Josefin Sans is a variable font, so it can be set to any weight. Each Tailwind weight below is the Josefin
       weight whose stroke is exactly as thick as the same weight in the old body font (Space Grotesk / Mada),
       measured from their capital I at 600px (stem as a fraction of the font size):
         normal  0.083 -> 375     light 0.063 -> 335     medium 0.108 -> 510
         semibold 0.122 -> 620    bold 0.132 -> 665
       (The display font, Alte Haas Grotesk, is excluded: its weights are set as before.) */
    .font-extralight:not(.font-display) { font-weight: 280; }
    .font-light:not(.font-display)      { font-weight: 335; }
    .font-normal:not(.font-display)     { font-weight: 375; }
    .font-medium:not(.font-display)     { font-weight: 510; }
    .font-semibold:not(.font-display)   { font-weight: 620; }
    .font-bold:not(.font-display),
    b:not(.font-display), strong:not(.font-display) { font-weight: 665; }
    .font-black:not(.font-display)      { font-weight: 700; }

    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes code-wave {
      0% { transform: scaleY(0.15); }
      35% { transform: scaleY(1.15); }
      65% { transform: scaleY(0.6); }
      100% { transform: scaleY(1); }
    }

    html.has-custom-cursor,
    html.has-custom-cursor * {
      cursor: none !important;
    }

    .text-stroke {
      -webkit-text-stroke: 1px currentColor;
      color: transparent;
    }

    .text-stroke-thick {
      -webkit-text-stroke: 2px currentColor;
      color: transparent;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-paper text-ink transition-colors duration-300 overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
