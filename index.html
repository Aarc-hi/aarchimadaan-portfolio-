<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarchi Madaan | Interaction Designer</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=4" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Italiana&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Bricolage Grotesque', 'sans-serif'],
            serif: ['Italiana', 'serif'],
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            'paper': '#FFFDF5',
            'paper-dark': '#0A0A0A',
            'ink': '#1A1A1A',
            'ink-light': '#F0F0F0',
            'cobalt': '#2A52BE', // Brighter cobalt
            'fun-pink': '#FF00CC',
            'fun-lime': '#CCFF00',
          },
          boxShadow: {
            'hard': '4px 4px 0px 0px currentColor',
            'hard-lg': '8px 8px 0px 0px currentColor',
            'hard-sm': '2px 2px 0px 0px currentColor',
          },
          animation: {
            'spin-slow': 'spin 12s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'marquee': 'marquee 25s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-100%)' },
            }
          }
        },
      },
    }
  </script>
  <style>
    /* Clean Brutalist Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      background: transparent;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border-left: 1px solid currentColor;
    }

    ::-webkit-scrollbar-thumb {
      background: currentColor;
    }

    ::-webkit-scrollbar-thumb:hover {
      opacity: 0.8;
    }

    body {
      cursor: default;
    }

    .text-stroke {
      -webkit-text-stroke: 1px currentColor;
      color: transparent;
    }

    .text-stroke-thick {
      -webkit-text-stroke: 2px currentColor;
      color: transparent;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-paper dark:bg-paper-dark text-ink dark:text-ink-light transition-colors duration-300 overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
